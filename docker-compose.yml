services:
  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://${DB_USER:-ledger}:${DB_PASSWORD:-ledger}@db:5432/${DB_NAME:-ledger}
      REDIS_URL: redis://redis:6379
      PORT: 4010
    ports:
      - "${APP_PORT:-4010}:4010"
    command: sh -c "npx prisma migrate deploy && npm start"
    healthcheck:
      test:
        ["CMD", "wget", "-qO-", "http://localhost:4010/ledger/trial-balance"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-ledger}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ledger}
      POSTGRES_DB: ${DB_NAME:-ledger}
    ports:
      - "${DB_PORT:-54329}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  db-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${DB_TEST_USER:-ledger}
      POSTGRES_PASSWORD: ${DB_TEST_PASSWORD:-ledger}
      POSTGRES_DB: ${DB_TEST_NAME:-ledger_test}
    ports:
      - "${DB_TEST_PORT:-54330}:5432"
    tmpfs:
      - /var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-63790}:6379"

volumes:
  pgdata: {}
